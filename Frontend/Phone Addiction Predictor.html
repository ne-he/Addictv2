<!-- GSAP + ScrollTrigger (untuk efek video scroll-triggered) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
  html, body { margin: 0; background: #0b0c0f; color: #e4e4e7; }
  body { font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(255,69,0,0.3); }

  /* custom range slider */
  .om-range {
    -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px;
    background: linear-gradient(to right, var(--accent) var(--pct), rgba(255,255,255,0.08) var(--pct));
    outline: none; cursor: pointer;
  }
  .om-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 3px solid var(--accent);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5); cursor: grab; transition: transform .15s ease;
  }
  .om-range::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.15); }
  .om-range::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%; background: #fff;
    border: 3px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.5); cursor: grab;
  }
  .om-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(255,255,255,0.25); }

  /* view + card transitions */
  @keyframes om-view-in { from { transform: translateY(6px); } to { transform: none; } }
  .om-view { animation: om-view-in .4s ease; }
  @keyframes om-fade-in { from { transform: translateY(10px); } to { transform: none; } }
  .om-fade { animation: om-fade-in .5s cubic-bezier(.22,1,.36,1); }

  @media (prefers-reduced-motion: reduce) {
    .om-view, .om-fade { animation: none !important; }
    * { scroll-behavior: auto !important; }
  }
  .text-balance { text-wrap: balance; }
  .text-pretty { text-wrap: pretty; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="src/scoring.jsx"></script>
<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/ui.jsx"></script>
<script type="text/babel" src="src/background.jsx"></script>
<script type="text/babel" src="src/gauge.jsx"></script>
<script type="text/babel" src="src/driverchart.jsx"></script>
<script type="text/babel" src="src/landing.jsx"></script>
<script type="text/babel" src="src/assessment.jsx"></script>
<script type="text/babel" src="src/result.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
